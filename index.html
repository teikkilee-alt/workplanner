<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>근무수첩</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f8; display: flex; justify-content: center; min-height: 100vh; }
        #app-container { width: 100%; max-width: 480px; background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; position: relative; }
        
        /* Auth Screen */
        .auth-card { padding: 24px; text-align: center; margin-top: 60px; }
        .auth-card h2 { margin-bottom: 20px; font-size: 24px; color: #1976D2; font-weight: bold; }
        .auth-card input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; }
        .auth-card button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; background: #1976D2; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .auth-card .sub-btn { background: #666; }

        /* Navigation */
        nav { display: flex; justify-content: space-around; background: #fff; border-top: 1px solid #eee; position: fixed; bottom: 0; width: 100%; max-width: 480px; height: 56px; align-items: center; z-index: 100; }
        nav div { text-align: center; font-size: 12px; cursor: pointer; color: #777; flex: 1; padding: 8px 0; }
        nav div.active { color: #1976D2; font-weight: bold; }

        /* Main Content */
        .page { display: none; padding: 10px; padding-bottom: 70px; }
        .page.active { display: block; }

        /* Summary Header */
        .summary-card { background: #E3F2FD; border: 1px solid #90CAF9; border-radius: 12px; padding: 12px; display: flex; justify-content: space-around; text-align: center; margin-bottom: 10px; }
        .summary-box { flex: 1; }
        .summary-title { font-size: 12px; color: #666; font-weight: bold; }
        .summary-value { font-size: 14px; color: #1976D2; font-weight: bold; margin: 2px 0; }
        .summary-sub { font-size: 11px; color: #424242; font-weight: bold; }

        /* Header Controls */
        .month-picker { display: flex; justify-content: center; align-items: center; gap: 16px; margin-bottom: 10px; }
        .month-picker button { background: none; border: none; font-size: 20px; cursor: pointer; font-weight: bold; color: #757575; padding: 0 8px; }
        .month-picker h3 { font-size: 20px; font-weight: bold; }

        /* Calendar Grid */
        .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; font-size: 14px; margin-bottom: 6px; }
        .calendar-header div:nth-child(1) { color: #D32F2F; }
        .calendar-header div:nth-child(7) { color: #1976D2; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        
        /* 고정 높이 및 정교한 고정 레이아웃 적용 */
        .day-cell { height: 80px; border-radius: 6px; border: 0.5px solid #E0E0E0; padding: 3px 1px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; cursor: pointer; font-size: 11px; position: relative; box-sizing: border-box; background: white; }
        .day-cell.selected { border: 2.5px solid #E65100 !important; }
        .day-cell.other-month { opacity: 0.35; }

        .cell-row { width: 100%; text-align: center; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .date-row { height: 16px; font-size: 11px; line-height: 16px; }
        .holiday-row { height: 14px; font-size: 8px; line-height: 14px; font-weight: bold; }
        .ticket-row { height: 14px; font-size: 9px; line-height: 14px; }
        .overtime-row { height: 14px; font-size: 10px; line-height: 14px; font-weight: bold; }

        /* Day Details Section */
        .detail-card { background: #F5F5F5; border-radius: 16px; padding: 14px; margin-top: 10px; }
        .action-row { display: flex; gap: 6px; margin: 8px 0; }
        .action-btn { flex: 1; padding: 6px 0; border-radius: 50px; border: 1.5px solid #1976D2; background: white; font-weight: bold; cursor: pointer; font-size: 12px; text-align: center; color: black; }
        .action-btn.red { border-color: #D32F2F; }

        .status-row { display: flex; gap: 8px; margin-top: 6px; }
        .status-btn { flex: 1; height: 40px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; color: black; }

        /* Modal Memo */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 85%; max-width: 360px; }
        .modal-content input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }

        /* Settings */
        .setting-card { background: #FAFAFA; border: 1px solid #E0E0E0; border-radius: 20px; padding: 16px; margin-bottom: 12px; }
        .setting-card h4 { margin-bottom: 8px; font-size: 16px; }
        .shift-select-row { margin-bottom: 12px; }
        .shift-options { display: flex; gap: 4px; margin-top: 6px; }
        .shift-opt { flex: 1; text-align: center; padding: 8px 0; border: 1px solid #E0E0E0; border-radius: 8px; font-size: 11px; cursor: pointer; background: #F5F5F5; font-weight: bold; }
        .shift-opt.selected { border: 2px solid #1E88E5; }

        /* Switch UI */
        .switch-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
        .switch-row:last-child { border-bottom: none; }
        .switch-label { font-size: 14px; font-weight: bold; color: #333; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #1976D2; }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body>

<div id="app-container">
    <!-- 로그인 화면 -->
    <div id="auth-screen" class="auth-card">
        <h2>📱 근무수첩 로그인</h2>
        <input type="email" id="auth-email" placeholder="이메일 아이디">
        <input type="password" id="auth-password" placeholder="비밀번호 (6자리 이상)">
        <button onclick="login()">로그인</button>
        <button class="sub-btn" onclick="signup()">회원가입</button>
    </div>

    <!-- 메인 앱 화면 -->
    <div id="main-screen" style="display: none;">
        <!-- 달력 탭 -->
        <div id="calendar-page" class="page active">
            <div class="summary-card">
                <div class="summary-box">
                    <div class="summary-title">🎫 남은 식권 수</div>
                    <div class="summary-value" id="summary-tickets">0 개</div>
                    <div class="summary-sub" id="summary-off">총 휴무 일수 : 0일</div>
                </div>
                <div style="width: 1px; background: #BDBDBD;"></div>
                <div class="summary-box">
                    <div class="summary-title">⏱️ 총 연장 근무 시간</div>
                    <div class="summary-value" id="summary-overtime" style="color: #E65100;">0 h</div>
                </div>
            </div>

            <div class="month-picker">
                <button onclick="changeMonth(-1)">◀</button>
                <h3 id="current-month-text">2026년 9월</h3>
                <button onclick="changeMonth(1)">▶</button>
            </div>

            <div class="calendar-header">
                <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>

            <div class="detail-card">
                <h4 id="selected-date-text">📝 1일 선택됨</h4>
                <div class="action-row">
                    <button class="action-btn" onclick="addTicket(1)">식권+1</button>
                    <button class="action-btn red" onclick="addTicket(-1)">식권-1</button>
                    <button class="action-btn" onclick="addOvertime(0.5)">연장<br>+0.5</button>
                    <button class="action-btn red" onclick="addOvertime(-0.5)">연장<br>-0.5</button>
                </div>

                <div style="background: white; padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 8px; font-size: 13px;">
                    <div id="detail-overtime" style="color:#E65100; font-weight:bold;">⏱️ 연장근무: 0시간</div>
                    <div id="detail-status" style="font-weight:bold;">📌 근무 상태: 근무</div>
                    <div id="detail-memo" style="color: #2E7D32;"></div>
                    <div id="detail-ticket" style="font-weight:bold;">🎫 식권: 내역 없음</div>
                </div>

                <div style="font-size: 12px; font-weight: bold; margin-bottom: 4px;">• 근무 상태 변경:</div>
                <div class="status-row">
                    <button id="btn-status-off" class="status-btn" style="background: #E0E0E0;" onclick="toggleOffStatus()">휴무</button>
                    <button id="btn-status-annual" class="status-btn" style="background: #FFF59D;" onclick="setStatus('연차')">연차</button>
                    <button id="btn-status-work" class="status-btn" style="background: #BBDEFB;" onclick="cycleWorkStatus()">근무</button>
                </div>
                <div id="reset-ticket-box" style="margin-top: 8px; display: none;">
                    <button onclick="resetDayTicket()" style="width: 100%; padding: 8px; background: #757575; color: white; border: none; border-radius: 6px; font-size: 12px;">당일 식권 기록 초기화 🔄</button>
                </div>
            </div>
        </div>

        <!-- 설정 탭 -->
        <div id="settings-page" class="page">
            <h2 style="margin-bottom: 16px;">⚙️ 설정</h2>

            <!-- 공휴일 표시 설정 카드 -->
            <div class="setting-card">
                <h4>🌐 국가별 공휴일 표시 설정</h4>
                <div class="switch-row">
                    <span class="switch-label">🇰🇷 대한민국 공휴일</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-kr" onchange="updateHolidayToggle('kr', this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="switch-row">
                    <span class="switch-label">🇯🇵 일본 공휴일</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-jp" onchange="updateHolidayToggle('jp', this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="switch-row">
                    <span class="switch-label">🇨🇳 중국 공휴일</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-cn" onchange="updateHolidayToggle('cn', this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="setting-card">
                <h4 id="setting-ticket-label">🎫 기본 식권 수량 설정</h4>
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="base-ticket-input" style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px;">
                    <button onclick="saveBaseTickets()" style="padding: 8px 16px; background: #1E88E5; color: white; border: none; border-radius: 6px; font-weight: bold;">저장</button>
                </div>
            </div>

            <div class="setting-card">
                <h4>📅 근무 패턴 설정</h4>
                <div id="shift-settings-container"></div>
            </div>

            <!-- 로그인 계정 정보 표시 카드 -->
            <div class="setting-card" style="text-align: center; background: #F5F5F5;">
                <div style="font-size: 12px; color: #666; font-weight: bold; margin-bottom: 4px;">👤 현재 로그인 계정</div>
                <div id="user-email-display" style="font-size: 14px; font-weight: bold; color: #1976D2;"></div>
            </div>

            <button onclick="logout()" style="width: 100%; padding: 12px; background: #D32F2F; color: white; border: none; border-radius: 8px; margin-top: 10px; font-weight: bold;">로그아웃</button>
        </div>

        <nav>
            <div id="nav-cal" class="active" onclick="switchTab('cal')">📅<br>달력</div>
            <div id="nav-set" onclick="switchTab('set')">⚙️<br>설정</div>
        </nav>
    </div>
</div>

<!-- 메모 작성 모달 -->
<div id="memo-modal" class="modal">
    <div class="modal-content">
        <h3 id="memo-title">📝 메모</h3>
        <input type="text" id="memo-input" maxlength="30" placeholder="메모 입력 (30자 이내)">
        <div class="modal-btns">
            <button onclick="deleteMemo()" style="background: none; border: none; color: #D32F2F; cursor: pointer;">삭제</button>
            <button onclick="closeMemoModal()" style="background: none; border: none; color: #666; cursor: pointer;">취소</button>
            <button onclick="saveMemo()" style="background: none; border: none; color: #1976D2; font-weight: bold; cursor: pointer;">저장</button>
        </div>
    </div>
</div>

<script>

        apiKey: "AIzaSyDnwYQ6WT9TVD-y5hbDWU7LkuafgIrivfQ",
        authDomain: "my-work-planner-4542.firebaseapp.com",
        projectId: "my-work-planner-4542",
        storageBucket: "my-work-planner-4542.firebasestorage.app",
        messagingSenderId: "204177923365",

    firebase.initializeApp(firebaseConfig);

    let currentUser = null;
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let selectedDay = new Date().getDate();

    let userMonthData = {};
    let allMonthsData = {};

    // 국가별 공휴일 표시 설정 (기본값: 한국 ON, 일본 OFF, 중국 OFF)
    let holidaySettings = JSON.parse(localStorage.getItem('holidaySettings')) || { kr: true, jp: false, cn: false };

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';

            document.getElementById('auth-screen').style.display = 'block';
            document.getElementById('main-screen').style.display = 'none';

    // 1. 대한민국 공휴일

        };

        if (varJp[dateStr]) return varJp[dateStr];
        if (fixedJp[monthDay]) return fixedJp[monthDay];
        return null;
    }

    // 3. 중국 공휴일
    function getChineseHoliday(year, month, day) {
        const m = month + 1;
        const dateStr = `${year}-${String(m).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const monthDay = `${String(m).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

        const fixedCn = {
            "01-01": "元旦", "05-01": "劳动节",
            "10-01": "国庆节", "10-02": "国庆节", "10-03": "国庆节", "10-04": "国庆节", "10-05": "国庆节", "10-06": "国庆节", "10-07": "国庆节"
        };

        const varCn = {
            "2024-02-10": "春节", "2024-02-11": "春节", "2024-02-12": "春节", "2024-04-04": "清明节", "2024-06-10": "端午节", "2024-09-17": "中秋节",
            "2025-01-29": "春节", "2025-01-30": "春节", "2025-01-31": "春节", "2025-04-04": "清明节", "2025-05-31": "端午节", "2025-10-06": "中秋节",
            "2026-02-17": "春节", "2026-02-18": "春节", "2026-02-19": "春节", "2026-04-05": "清明节", "2026-06-19": "端午节", "2026-09-25": "中秋节",
            "2027-02-07": "春节", "2027-02-08": "春节", "2027-02-09": "春节", "2027-04-05": "清明节", "2027-06-09": "端午节", "2027-09-15": "中秋节",
            "2028-01-27": "春节", "2028-01-28": "春节", "2028-01-29": "春节", "2028-04-04": "清明节", "2028-05-28": "端午节", "2028-10-03": "中秋节"
        };

        if (varCn[dateStr]) return varCn[dateStr];
        if (fixedCn[monthDay]) return fixedCn[monthDay];
        return null;
    }

    // 선택된 설정에 따른 공휴일 수집 함수
    function getActiveHolidays(year, month, day) {
        let list = [];
        if (holidaySettings.kr) {
            const kr = getKoreanHoliday(year, month, day);
            if (kr) list.push({ country: 'kr', name: kr, flag: '🇰🇷' });
        }
        if (holidaySettings.jp) {
            const jp = getJapaneseHoliday(year, month, day);
            if (jp) list.push({ country: 'jp', name: jp, flag: '🇯🇵' });
        }
        if (holidaySettings.cn) {
            const cn = getChineseHoliday(year, month, day);
            if (cn) list.push({ country: 'cn', name: cn, flag: '🇨🇳' });
        }
        return list;
    }

    function getAuthErrorMessage(error) {
        switch (error.code) {
            case 'auth/weak-password': return '비밀번호는 최소 6자리 이상이어야 합니다.';
            case 'auth/email-already-in-use': return '이미 가입되어 있는 이메일 주소입니다.';
            case 'auth/invalid-email': return '올바른 이메일 형식이 아닙니다.';
            case 'auth/user-not-found':
            case 'auth/wrong-password':
            case 'auth/invalid-credential': return '이메일 또는 비밀번호가 올바르지 않습니다.';
            default: return '오류가 발생했습니다: ' + error.message;
        }
    }

    function login() {
        const email = document.getElementById('auth-email').value.trim();
        const pass = document.getElementById('auth-password').value;
        if (!email || !pass) { alert("이메일과 비밀번호를 모두 입력해 주세요."); return; }
        auth.signInWithEmailAndPassword(email, pass).catch(e => alert(getAuthErrorMessage(e)));
    }

    function signup() {
        const email = document.getElementById('auth-email').value.trim();
        const pass = document.getElementById('auth-password').value;
        if (!email || !pass) { alert("이메일과 비밀번호를 모두 입력해 주세요."); return; }
        auth.createUserWithEmailAndPassword(email, pass).then(() => alert("회원가입이 완료되었습니다!")).catch(e => alert(getAuthErrorMessage(e)));
    }

    function logout() { auth.signOut(); }

    function switchTab(tab) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav div').forEach(n => n.classList.remove('active'));
        if(tab === 'cal') {
            document.getElementById('calendar-page').classList.add('active');
            document.getElementById('nav-cal').classList.add('active');
        } else {
            document.getElementById('settings-page').classList.add('active');
            document.getElementById('nav-set').classList.add('active');
            renderSettings();

    function getDefaultMonthData() {
        return {
            baseTicketCount: 9,
            shift1to10: "모닝 🌅",
            shift11to20: "상근 💼",
            shift21to30: "데이 ⏰",
            shift31: "야간 🌙",
            days: {}
        };
    }

    function getDocRef(y = currentYear, m = currentMonth) {
        const monthKey = `${y}_${m}`;
        return db.collection('users').doc(currentUser.uid).collection('months').doc(monthKey);
    }

    function loadData() {
        let prevYear = currentYear, prevMonth = currentMonth - 1;
        if (prevMonth < 0) { prevMonth = 11; prevYear--; }

        let nextYear = currentYear, nextMonth = currentMonth + 1;
        if (nextMonth > 11) { nextMonth = 0; nextYear++; }

        const currentKey = `${currentYear}_${currentMonth}`;
        const prevKey = `${prevYear}_${prevMonth}`;
        const nextKey = `${nextYear}_${nextMonth}`;

        Promise.all([
            getDocRef(prevYear, prevMonth).get(),
            getDocRef(currentYear, currentMonth).get(),
            getDocRef(nextYear, nextMonth).get()
        ]).then(([prevDoc, currentDoc, nextDoc]) => {
            allMonthsData[prevKey] = prevDoc.exists ? prevDoc.data() : getDefaultMonthData();
            allMonthsData[currentKey] = currentDoc.exists ? currentDoc.data() : getDefaultMonthData();
            allMonthsData[nextKey] = nextDoc.exists ? nextDoc.data() : getDefaultMonthData();

            userMonthData = allMonthsData[currentKey];

            autoApplyMorningTicketsForMonth(prevYear, prevMonth);
            autoApplyMorningTicketsForMonth(currentYear, currentMonth);
            autoApplyMorningTicketsForMonth(nextYear, nextMonth);

            renderCalendar();
            renderSettings();
        });
    }

    function saveData() {
        const currentKey = `${currentYear}_${currentMonth}`;
        allMonthsData[currentKey] = userMonthData;
        getDocRef(currentYear, currentMonth).set(userMonthData, { merge: true }).then(() => {
            renderCalendar();
        });
    }

    function getShiftColor(shift) {
        if(!shift) return '#FFFFFF';
        if(shift.includes("모닝")) return '#FFCC99';
        if(shift.includes("상근")) return '#FFFFFF';
        if(shift.includes("데이")) return '#B3E5FC';
        if(shift.includes("야간")) return '#E1BEE7';
        return '#FFFFFF';
    }

    function getShiftForDay(d, mData) {
        const data = mData || userMonthData;
        if(!data) return "상근 💼";
        if(d <= 10) return data.shift1to10;
        if(d <= 20) return data.shift11to20;
        if(d <= 30) return data.shift21to30;
        return data.shift31;
    }

    function autoApplyMorningTicketsForMonth(y, m) {
        const monthKey = `${y}_${m}`;
        const mData = allMonthsData[monthKey];
        if(!mData) return;
        if(!mData.days) mData.days = {};

        const totalDays = new Date(y, m + 1, 0).getDate();
        for(let d=1; d<=totalDays; d++) {
            let shift = getShiftForDay(d, mData);
            const isMorning = shift && shift.includes("모닝");
            const dateKey = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

            if(!mData.days[dateKey]) {
                mData.days[dateKey] = { earned: isMorning ? 1 : 0, used: 0, status: '근무', overtime: 0, memo: '' };
            } else {
                const day = mData.days[dateKey];
                if (!isMorning) {
                    if (day.earned === 1 && !day.manualEarned) day.earned = 0;
                } else {
                    const isNonWork = ['휴무', '연차', '검진'].includes(day.status);
                    if (isNonWork) {
                        if (day.earned === 1 && !day.manualEarned) day.earned = 0;
                    } else if (day.earned === 0 && !day.resetByUser && !day.manualEarned) {
                        day.earned = 1;
                    }
                }
            }
        }
    }

    function createCellElement(y, m, d, isOtherMonth) {
        const monthKey = `${y}_${m}`;
        const targetMonthData = allMonthsData[monthKey] || getDefaultMonthData();
        const dateKey = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        
        let dayData = (targetMonthData.days && targetMonthData.days[dateKey]);
        let shift = getShiftForDay(d, targetMonthData);

        if (!dayData) {
            const isMorning = shift && shift.includes("모닝");
            dayData = { earned: isMorning ? 1 : 0, used: 0, status: '근무', overtime: 0, memo: '' };
        }

        const cell = document.createElement('div');
        cell.className = `day-cell ${isOtherMonth ? 'other-month' : ''} ${(!isOtherMonth && d === selectedDay) ? 'selected' : ''}`;

        if (dayData.status === '휴무') cell.style.background = '#E0E0E0';
        else if (dayData.status === '검진') cell.style.background = '#C8E6C9';
        else if (dayData.status === '연차') cell.style.background = '#FFF176';
        else cell.style.background = getShiftColor(shift);

        const dayOfWeek = new Date(y, m, d).getDay();
        const holidays = getActiveHolidays(y, m, d);
        const hasKrHoliday = holidays.some(h => h.country === 'kr');

        let dateColor = 'black';
        if (dayOfWeek === 0 || hasKrHoliday) dateColor = '#D32F2F'; // 일요일 또는 한국 공휴일 빨간색
        else if (dayOfWeek === 6) dateColor = '#1976D2'; // 토요일 파란색

        let statusText = '';
        if (dayData.status === '남') statusText = `<span style="color:#1976D2; font-weight:bold;"> (남)</span>`;
        else if (dayData.status === '북') statusText = `<span style="color:#6A1B9A; font-weight:bold;"> (북)</span>`;
        else if (dayData.status === '휴근') statusText = `<span style="color:#E65100; font-weight:bold;"> (휴근)</span>`;
        else if (dayData.status === '검진') statusText = `<span style="color:#2E7D32; font-weight:bold;"> (검진)</span>`;

        let memoIcon = dayData.memo ? `<span style="color:#2E7D32; font-weight:bold;"> ✔</span>` : '';

        // 공휴일 행 태그 생성
        let holidayHTML = '&nbsp;';
        if (holidays.length > 0) {
            holidayHTML = holidays.map(h => {
                let color = h.country === 'kr' ? '#D32F2F' : (h.country === 'jp' ? '#1976D2' : '#E65100');
                return `<span style="color:${color};">${h.flag}${h.name}</span>`;
            }).join(' ');
        }

        // 식권 행 생성
        let earnedUsedHTML = '&nbsp;';
        if (dayData.earned > 0 || dayData.used > 0) {
            let earnedStr = dayData.earned > 0 ? `<span style="color:#1976D2; font-weight:bold;">+${dayData.earned}</span>` : '';
            let usedStr = dayData.used > 0 ? `<span style="color:#D32F2F; font-weight:bold;">-${dayData.used}</span>` : '';
            earnedUsedHTML = `${earnedStr} ${usedStr}`.trim();
        }

        // 연장근무 행 생성
        let overtimeHTML = dayData.overtime > 0 ? `${dayData.overtime}h` : '&nbsp;';

        // 완벽한 수평 유지를 위한 고정 행 구조
        cell.innerHTML = `
            <div class="cell-row date-row" style="color:${dateColor}; font-weight:bold;">
                ${d}${statusText}${memoIcon}
            </div>
            <div class="cell-row holiday-row">
                ${holidayHTML}
            </div>
            <div class="cell-row ticket-row">
                ${earnedUsedHTML}
            </div>
            <div class="cell-row overtime-row">
                ${overtimeHTML}
            </div>
        `;

        cell.onclick = () => {
            if (isOtherMonth) {
                currentYear = y; currentMonth = m; selectedDay = d; loadData();
            } else {
                if (selectedDay === d) openMemoModal(dayData.memo || '');
                else { selectedDay = d; renderCalendar(); }
            }
        };

        return cell;
    }

    function renderCalendar() {
        document.getElementById('current-month-text').innerText = `${currentYear}년 ${currentMonth + 1}월`;
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';

        let prevYear = currentYear, prevMonth = currentMonth - 1;
        if (prevMonth < 0) { prevMonth = 11; prevYear--; }

        let nextYear = currentYear, nextMonth = currentMonth + 1;
        if (nextMonth > 11) { nextMonth = 0; nextYear++; }

        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
        const prevMonthTotalDays = new Date(currentYear, prevMonth + 1, 0).getDate();

        let totalEarned = 0, totalUsed = 0, totalOvertime = 0, offDays = 0, remainingWorkDays = 0;
        const today = new Date();
        const isCurrentMonth = (today.getFullYear() === currentYear && today.getMonth() === currentMonth);

        for(let i=0; i<firstDay; i++) {
            const pDay = prevMonthTotalDays - (firstDay - 1 - i);
            grid.appendChild(createCellElement(prevYear, prevMonth, pDay, true));
        }

        for(let d=1; d<=totalDays; d++) {
            const dateKey = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const dayData = (userMonthData.days && userMonthData.days[dateKey]) || { earned:0, used:0, status:'근무', overtime:0, memo:'' };

            totalEarned += dayData.earned || 0;
            totalUsed += dayData.used || 0;
            totalOvertime += dayData.overtime || 0;
            if(dayData.status === '휴무') offDays++;

            if ((isCurrentMonth && d >= today.getDate()) || (!isCurrentMonth && currentYear >= today.getFullYear() && currentMonth > today.getMonth())) {
                if(!['휴무', '검진', '연차'].includes(dayData.status)) remainingWorkDays++;
            }

            grid.appendChild(createCellElement(currentYear, currentMonth, d, false));
        }

        const totalRendered = firstDay + totalDays;
        const nextDaysCount = (7 - (totalRendered % 7)) % 7;
        for(let n=1; n<=nextDaysCount; n++) {
            grid.appendChild(createCellElement(nextYear, nextMonth, n, true));
        }

        const baseTickets = userMonthData.baseTicketCount || 9;
        const finalTickets = baseTickets + totalEarned - totalUsed;
        
        let ticketSub = '';
        if(totalEarned > 0 && totalUsed > 0) ticketSub = ` (+${totalEarned} / -${totalUsed})`;
        else if(totalEarned > 0) ticketSub = ` (+${totalEarned})`;
        else if(totalUsed > 0) ticketSub = ` (-${totalUsed})`;

        document.getElementById('summary-tickets').innerText = `${finalTickets} 개${ticketSub}`;
        document.getElementById('summary-off').innerText = `총 휴무 일수 : ${offDays}일`;
        document.getElementById('summary-overtime').innerText = `${totalOvertime} h (${remainingWorkDays}일 남음)`;

        renderDetail();
    }

    function renderDetail() {
        const dateKey = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(selectedDay).padStart(2,'0')}`;
        const dayData = (userMonthData.days && userMonthData.days[dateKey]) || { earned:0, used:0, status:'근무', overtime:0, memo:'' };
        
        const holidays = getActiveHolidays(currentYear, currentMonth, selectedDay);
        const holidayStr = holidays.length > 0 ? ` (${holidays.map(h => `${h.flag}${h.name}`).join(', ')})` : '';

        document.getElementById('selected-date-text').innerText = `📝 ${currentMonth + 1}월 ${selectedDay}일${holidayStr} 선택됨`;
        document.getElementById('detail-overtime').innerText = `⏱️ 연장근무: ${dayData.overtime || 0}시간`;
        document.getElementById('detail-status').innerText = `📌 근무 상태: ${dayData.status || '근무'}`;
        document.getElementById('detail-memo').innerText = dayData.memo ? `📝 메모: ${dayData.memo}` : '';
        
        if(!dayData.earned && !dayData.used) {
            document.getElementById('detail-ticket').innerText = `🎫 식권: 내역 없음`;
        } else {
            let tTxt = `🎫 식권: `;
            if(dayData.earned > 0) tTxt += `${dayData.earned}개 획득 `;
            if(dayData.used > 0) tTxt += `${dayData.used}개 사용`;
            document.getElementById('detail-ticket').innerText = tTxt;
        }
        
        const offBtn = document.getElementById('btn-status-off');
        offBtn.innerText = dayData.status === '검진' ? '검진' : '휴무';
        offBtn.style.background = dayData.status === '검진' ? '#388E3C' : (dayData.status === '휴무' ? '#757575' : '#E0E0E0');
        offBtn.style.color = (dayData.status === '휴무' || dayData.status === '검진') ? 'white' : 'black';

        const workBtn = document.getElementById('btn-status-work');
        let wText = '근무';
        if(dayData.status === '남') { wText = '근무(남)'; workBtn.style.background = '#1565C0'; workBtn.style.color = 'white'; }
        else if(dayData.status === '북') { wText = '근무(북)'; workBtn.style.background = '#6A1B9A'; workBtn.style.color = 'white'; }
        else if(dayData.status === '휴근') { wText = '근무(휴근)'; workBtn.style.background = '#E65100'; workBtn.style.color = 'white'; }
        else if(dayData.status === '근무') { wText = '근무'; workBtn.style.background = '#1E88E5'; workBtn.style.color = 'white'; }
        else { wText = '근무'; workBtn.style.background = '#BBDEFB'; workBtn.style.color = 'black'; }
        workBtn.innerText = wText;

        const resetBox = document.getElementById('reset-ticket-box');
        resetBox.style.display = ((dayData.earned || 0) > 0 || (dayData.used || 0) > 0) ? 'block' : 'none';
    }

    function getSelectedDayData() {
        if(!userMonthData.days) userMonthData.days = {};
        const dateKey = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(selectedDay).padStart(2,'0')}`;
        if(!userMonthData.days[dateKey]) {
            userMonthData.days[dateKey] = { earned:0, used:0, status:'근무', overtime:0, memo:'' };
        }
        return { data: userMonthData.days[dateKey], key: dateKey, dayNum: selectedDay };
    }

    function addTicket(val) {
        const { data } = getSelectedDayData();
        if(val > 0) { data.earned = (data.earned || 0) + val; data.manualEarned = true; }
        else { data.used = Math.max(0, (data.used || 0) - val); }
        saveData();
    }

    function resetDayTicket() {
        const { data } = getSelectedDayData();
        data.earned = 0; data.used = 0; data.resetByUser = true; data.manualEarned = false;
        saveData();
    }

    function addOvertime(val) {
        const { data } = getSelectedDayData();
        data.overtime = Math.max(0, (data.overtime || 0) + val);
        saveData();
    }

    function setStatus(status) {
        const { data, dayNum } = getSelectedDayData();
        if (data.status === '휴근' && status !== '휴근') data.overtime = Math.max(0, (data.overtime || 0) - 8.0);
        data.status = status;
        
        const shift = getShiftForDay(dayNum, userMonthData);
        const isMorning = shift && shift.includes("모닝");

        if (['휴무', '연차', '검진'].includes(status)) {
            if (isMorning && data.earned === 1 && !data.manualEarned) data.earned = 0;
        } else {
            if (isMorning && data.earned === 0 && !data.resetByUser) data.earned = 1;
        }
        saveData();
    }

    function toggleOffStatus() {
        const { data, dayNum } = getSelectedDayData();
        if (data.status === '휴근') data.overtime = Math.max(0, (data.overtime || 0) - 8.0);
        data.status = data.status === '휴무' ? '검진' : '휴무';

        const shift = getShiftForDay(dayNum, userMonthData);
        if (shift && shift.includes("모닝") && data.earned === 1 && !data.manualEarned) data.earned = 0;
        saveData();
    }

    function cycleWorkStatus() {
        const { data, dayNum } = getSelectedDayData();
        const cycle = ['근무', '남', '북', '휴근'];
        let idx = cycle.indexOf(data.status);

        if (data.status === '휴근') data.overtime = Math.max(0, (data.overtime || 0) - 8.0);

        let next = cycle[(idx + 1) % cycle.length];
        data.status = next;

        if (next === '휴근') data.overtime = (data.overtime || 0) + 8.0;

        const shift = getShiftForDay(dayNum, userMonthData);
        if (shift && shift.includes("모닝") && data.earned === 0 && !data.resetByUser) data.earned = 1;
        saveData();
    }

    function changeMonth(delta) {
        currentMonth += delta;
        if(currentMonth < 0) { currentMonth = 11; currentYear--; }
        if(currentMonth > 11) { currentMonth = 0; currentYear++; }
        selectedDay = 1;
        loadData();
    }

    function openMemoModal(memo) {
        document.getElementById('memo-title').innerText = `📝 ${currentMonth + 1}월 ${selectedDay}일 메모`;
        document.getElementById('memo-input').value = memo;
        document.getElementById('memo-modal').style.display = 'flex';
    }
    function closeMemoModal() { document.getElementById('memo-modal').style.display = 'none'; }
    function saveMemo() {
        const { data } = getSelectedDayData();
        data.memo = document.getElementById('memo-input').value;
        closeMemoModal();
        saveData();
    }
    function deleteMemo() {
        const { data } = getSelectedDayData();
        data.memo = '';
        closeMemoModal();
        saveData();
    }

    function renderSettings() {
        document.getElementById('toggle-kr').checked = !!holidaySettings.kr;
        document.getElementById('toggle-jp').checked = !!holidaySettings.jp;
        document.getElementById('toggle-cn').checked = !!holidaySettings.cn;

        document.getElementById('setting-ticket-label').innerText = `🎫 ${currentYear}년 ${currentMonth + 1}월 기본 식권 수량`;
        document.getElementById('base-ticket-input').value = userMonthData.baseTicketCount || 9;

        if (currentUser) {
            document.getElementById('user-email-display').innerText = currentUser.email || '이메일 정보 없음';
        }

        const container = document.getElementById('shift-settings-container');
        container.innerHTML = '';

        const shifts = [
            { key: 'shift1to10', label: '1일 ~ 10일' },
            { key: 'shift11to20', label: '11일 ~ 20일' },
            { key: 'shift21to30', label: '21일 ~ 30일' },
            { key: 'shift31', label: '31일 (개별)' }
        ];

        shifts.forEach(s => {
            const div = document.createElement('div');
            div.className = 'shift-select-row';
            div.innerHTML = `
                <div style="font-size:13px; font-weight:bold; color:#666;">${s.label}</div>
                <div class="shift-options">
                    ${['모닝 🌅', '상근 💼', '데이 ⏰', '야간 🌙'].map(opt => `
                        <div class="shift-opt ${userMonthData[s.key] === opt ? 'selected' : ''}" 
                             style="background: ${userMonthData[s.key] === opt ? getShiftColor(opt) : '#F5F5F5'}"
                             onclick="updateShiftPattern('${s.key}', '${opt}')">${opt.split(' ')[0]}</div>
                    `).join('')}
                </div>
            `;
            container.appendChild(div);
        });
    }

    function updateHolidayToggle(country, value) {
        holidaySettings[country] = value;
        localStorage.setItem('holidaySettings', JSON.stringify(holidaySettings));
        renderCalendar();
    }

    function saveBaseTickets() {
        userMonthData.baseTicketCount = parseInt(document.getElementById('base-ticket-input').value) || 0;
        saveData();
    }

    function updateShiftPattern(key, val) {
        userMonthData[key] = val;
        autoApplyMorningTicketsForMonth(currentYear, currentMonth);
        saveData();
        renderSettings();
    }

    // ===================================================================
    // 💡 추가하고자 하시는 자바스크립트 코드/함수가 있다면 이 아래에 넣으시면 됩니다.
    // ===================================================================
import React, { useState } from 'react';

// 1. 공휴일 한국어 변환 매핑 (외국어 명칭 및 불필요 표기 정리)
const HOLIDAY_MAP = {
  '国庆节': '🇨🇳 국경절',
  '국경절': '🇨🇳 국경절',
  'スポーツの日': '🇯🇵 스포츠의 날',
  '스포츠의 날': '🇯🇵 스포츠의 날',
  '개천절': '🇰🇷 개천절',
  '한글날': '🇰🇷 한글날',
  '대체공휴일': '🇰🇷 대체공휴일',
};

// 2. 2026년 10월 날짜 데이터 샘플
const INITIAL_DAYS_DATA = {
  '2026-10-01': { holidays: ['국경절'], overtime: '2h', mealTickets: 3, status: '근무' },
  '2026-10-02': { holidays: ['국경절'], overtime: '2h', mealTickets: 1, status: '근무' },
  '2026-10-03': { holidays: ['개천절', '국경절'], overtime: '', mealTickets: 0, status: '휴무' },
  '2026-10-04': { holidays: ['국경절'], overtime: '', mealTickets: 0, status: '휴무' },
  '2026-10-05': { holidays: ['대체공휴일', '국경절', '추석연휴'], overtime: '2h', mealTickets: 1, status: '근무' },
  '2026-10-06': { holidays: ['국경절'], overtime: '2h', mealTickets: 1, status: '근무' },
  '2026-10-07': { holidays: ['국경절', '개천절'], overtime: '2h', mealTickets: 1, status: '근무' },
  '2026-10-08': { holidays: ['국경절'], overtime: '2h', mealTickets: 1, status: '근무' },
  '2026-10-09': { holidays: ['한글날'], overtime: '', mealTickets: 0, status: '휴무' },
  '2026-10-12': { holidays: ['스포츠의 날'], overtime: '2h', mealTickets: 1, status: '근무' },
};

export default function CalendarApp() {
  const [selectedDate, setSelectedDate] = useState('2026-10-07');
  const [daysData, setDaysData] = useState(INITIAL_DAYS_DATA);
  const [workStatus, setWorkStatus] = useState('근무');

  // 셀 내부 공휴일 텍스트 처리: 2개 이상일 때 '첫공휴일 외 N개' 표기
  const getFormattedHolidayBadge = (holidays) => {
    if (!holidays || holidays.length === 0) return null;
    const translatedList = holidays.map((h) => HOLIDAY_MAP[h] || h);

    if (translatedList.length > 1) {
      return `${translatedList[0]} 외 ${translatedList.length - 1}`;
    }
    return translatedList[0];
  };

  // 선택된 날짜 정보 및 공휴일 한국어 풀버전 리스트
  const selectedDayInfo = daysData[selectedDate] || {};
  const selectedHolidays = (selectedDayInfo.holidays || []).map((h) => HOLIDAY_MAP[h] || h);
  const selectedDayNum = parseInt(selectedDate.split('-')[2], 10);
  const selectedMonthNum = parseInt(selectedDate.split('-')[1], 10);

  const handleDateClick = (dateStr) => {
    setSelectedDate(dateStr);
    if (daysData[dateStr]?.status) {
      setWorkStatus(daysData[dateStr].status);
    }
  };

  // 달력 그리드 렌더링 (셀 높이를 고정하여 레이아웃이 변하지 않음)
  const renderCalendarCells = () => {
    const cells = [];

    // 9월 (이전달) 날짜 4일
    const prevMonthDays = [
      { day: 27, fullDate: '2026-09-27', holidays: [] },
      { day: 28, fullDate: '2026-09-28', holidays: ['대체공휴일'], overtimeAdd: '2.5h' },
      { day: 29, fullDate: '2026-09-29', holidays: [], overtimeAdd: '3h' },
      { day: 30, fullDate: '2026-09-30', holidays: [], overtimeAdd: '2h' },
    ];

    prevMonthDays.forEach((item, idx) => {
      cells.push(
        <div key={`prev-${idx}`} className="h-[84px] bg-gray-50 border border-gray-100 p-1 flex flex-col justify-between text-gray-400 opacity-60">
          <div className="flex justify-between items-center text-xs">
            <span className={idx === 0 ? 'text-red-400' : ''}>{item.day}</span>
            <span className="text-[10px]">{item.overtimeAdd}</span>
          </div>
          {item.holidays.length > 0 && (
            <div className="text-[10px] truncate text-gray-400">
              {getFormattedHolidayBadge(item.holidays)}
            </div>
          )}
          <div className="h-3"></div>
        </div>
      );
    });

    // 10월 날짜 (1일 ~ 31일)
    for (let d = 1; d <= 31; d++) {
      const dayStr = d < 10 ? `0${d}` : `${d}`;
      const fullDate = `2026-10-${dayStr}`;
      const isSelected = selectedDate === fullDate;
      const dayData = daysData[fullDate] || {};
      const holidays = dayData.holidays || [];
      const isSunday = (d + 4) % 7 === 1;
      const isSaturday = (d + 4) % 7 === 0;

      const hasWorkSchedule = [
        '2026-10-01', '2026-10-02', '2026-10-05', '2026-10-06', '2026-10-07',
        '2026-10-08', '2026-10-12', '2026-10-13', '2026-10-14', '2026-10-15',
        '2026-10-16', '2026-10-19', '2026-10-20', '2026-10-21', '2026-10-22',
        '2026-10-26', '2026-10-27'
      ].includes(fullDate);

      cells.push(
        <div
          key={fullDate}
          onClick={() => handleDateClick(fullDate)}
          /* h-[84px] 고정 높이와 overflow-hidden으로 달력 틀 고정 */
          className={`h-[84px] p-1 border flex flex-col justify-between cursor-pointer transition-all overflow-hidden ${
            isSelected
              ? 'border-2 border-orange-500 rounded-lg shadow-sm z-10 bg-white'
              : hasWorkSchedule
              ? 'bg-purple-100/60 border-purple-200'
              : 'bg-white border-gray-100'
          }`}
        >
          {/* 상단: 날짜 */}
          <div className="flex justify-between items-center">
            <span
              className={`text-xs font-semibold ${
                isSunday || holidays.length > 0
                  ? 'text-red-500'
                  : isSaturday
                  ? 'text-blue-500'
                  : 'text-gray-800'
              }`}
            >
              {d}
            </span>
          </div>

          {/* 중앙: 공휴일 표기 (항상 1줄 고정, 외 N개 형태) */}
          <div className="my-auto">
            {holidays.length > 0 && (
              <div className="text-[10px] font-medium text-red-600 bg-red-50 px-1 py-0.5 rounded truncate">
                {getFormattedHolidayBadge(holidays)}
              </div>
            )}
          </div>

          {/* 하단: 연장근무 시간 */}
          <div className="text-right text-[10px] text-gray-600 font-medium h-3">
            {dayData.overtime || ''}
          </div>
        </div>
      );
    }

    return cells;
  };

  return (
    <div className="max-w-md mx-auto bg-gray-50 min-h-screen flex flex-col justify-between text-gray-800 font-sans pb-16">
      {/* 1. 상단 통계 바 */}
      <div className="bg-sky-50/80 p-3 m-2 rounded-xl shadow-sm border border-sky-100 flex justify-between items-center text-xs">
        <div className="flex-1 text-center border-r border-sky-200">
          <div className="text-gray-500 text-[11px] font-medium">🎫 남은 식권 수</div>
          <div className="text-blue-600 font-bold text-sm mt-0.5">
            12 개 <span className="text-xs font-normal text-blue-500">(-3)</span>
          </div>
          <div className="text-[10px] text-gray-400 mt-0.5">총 휴무 일수: 10일</div>
        </div>
        <div className="flex-1 text-center">
          <div className="text-gray-500 text-[11px] font-medium">⏰ 총 연장 근무 시간</div>
          <div className="text-orange-600 font-bold text-sm mt-0.5">
            26 h <span className="text-xs font-normal text-gray-500">(20일 남음)</span>
          </div>
        </div>
      </div>

      {/* 2. 달력 헤더 */}
      <div className="flex items-center justify-center gap-6 my-2">
        <button className="text-gray-400 hover:text-gray-600 text-sm">◀</button>
        <h2 className="text-lg font-bold tracking-tight">2026년 10월</h2>
        <button className="text-gray-400 hover:text-gray-600 text-sm">▶</button>
      </div>

      {/* 3. 고정 그리드 달력 */}
      <div className="px-2">
        <div className="grid grid-cols-7 text-center font-bold text-xs py-1.5 bg-white border-b border-gray-100">
          <span className="text-red-500">일</span>
          <span>월</span>
          <span>화</span>
          <span>수</span>
          <span>목</span>
          <span>금</span>
          <span className="text-blue-500">토</span>
        </div>

        <div className="grid grid-cols-7 gap-0.5 bg-gray-100 p-0.5 rounded-b-md">
          {renderCalendarCells()}
        </div>
      </div>

      {/* 4. 하단 상세 정보 및 메모 영역 (요청 2, 3번 적용) */}
      <div className="p-4 bg-white border-t border-gray-200 mt-3 shadow-lg">
        {/* 선택된 날짜 메모 헤더 */}
        <div className="pb-2 border-b border-gray-100">
          <h3 className="text-base font-bold text-gray-900 flex items-center gap-1">
            📝 {selectedMonthNum}월 {selectedDayNum}일 메모
          </h3>
        </div>

        {/* 해당 날짜 공휴일 한국어 풀버전 목록 */}
        <div className="py-2.5 px-3 my-2 bg-gray-50 rounded-lg border border-gray-100">
          <div className="text-xs font-semibold text-gray-500 mb-1">공휴일 정보</div>
          {selectedHolidays.length > 0 ? (
            <div className="text-xs font-bold text-red-600 space-y-1">
              {selectedHolidays.map((holiday, idx) => (
                <div key={idx} className="flex items-center gap-1">
                  <span>•</span>
                  <span>{holiday}</span>
                </div>
              ))}
            </div>
          ) : (
            <div className="text-xs text-gray-400">등록된 공휴일이 없습니다.</div>
          )}
        </div>

        {/* 식권 및 연장시간 수량 조작 버튼 */}
        <div className="grid grid-cols-4 gap-2 my-3">
          <button className="py-2 text-xs font-bold text-blue-600 border border-blue-400 rounded-full hover:bg-blue-50">
            식권+1
          </button>
          <button className="py-2 text-xs font-bold text-red-600 border border-red-400 rounded-full hover:bg-red-50">
            식권-1
          </button>
          <button className="py-2 text-xs font-bold text-blue-600 border border-blue-400 rounded-full hover:bg-blue-50">
            연장 +0.5
          </button>
          <button className="py-2 text-xs font-bold text-red-600 border border-red-400 rounded-full hover:bg-red-50">
            연장 -0.5
          </button>
        </div>

        {/* 선택 날짜 상세 상태 요약 */}
        <div className="text-xs space-y-1 text-gray-700 bg-orange-50/50 p-2.5 rounded-lg mb-3">
          <div>⏰ <b>연장근무:</b> {selectedDayInfo.overtime || '0시간'}</div>
          <div>📌 <b>근무 상태:</b> {workStatus}</div>
          <div>🎫 <b>식권:</b> {selectedDayInfo.mealTickets || 0}개 사용</div>
        </div>

        {/* 근무 상태 변경 버튼 그룹 */}
        <div className="grid grid-cols-3 gap-1 bg-gray-100 p-1 rounded-lg">
          {['휴무', '연차', '근무'].map((status) => (
            <button
              key={status}
              onClick={() => setWorkStatus(status)}
              className={`py-2 text-xs font-bold rounded-md transition-all ${
                workStatus === status
                  ? 'bg-blue-600 text-white shadow-sm'
                  : 'text-gray-600 hover:bg-gray-200'
              }`}
            >
              {status}
            </button>
          ))}
        </div>
      </div>

      {/* 5. 하단 탭 바 */}
      <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 flex justify-around py-2 z-20">
        <div className="flex flex-col items-center text-xs text-blue-600 font-bold cursor-pointer">
          <span>📅</span>
          <span>달력</span>
        </div>
        <div className="flex flex-col items-center text-xs text-gray-400 cursor-pointer">
          <span>⚙️</span>
          <span>설정</span>
        </div>
      </div>
    </div>
  );
}
</script>
</body>
</html>
