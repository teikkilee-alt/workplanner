<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>근무수첩</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f8; display: flex; justify-content: center; min-height: 100vh; }
        #app-container { width: 100%; max-width: 480px; background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; position: relative; }
        
        /* Auth Screen */
        .auth-card { padding: 24px; text-align: center; margin-top: 60px; }
        .auth-card h2 { margin-bottom: 20px; font-size: 24px; color: #1976D2; font-weight: bold; }
        .auth-card input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; }
        .auth-card button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; background: #1976D2; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .auth-card .sub-btn { background: #666; }

        /* Navigation */
        nav { display: flex; justify-content: space-around; background: #fff; border-top: 1px solid #eee; position: fixed; bottom: 0; width: 100%; max-width: 480px; height: 56px; align-items: center; z-index: 100; }
        nav div { text-align: center; font-size: 12px; cursor: pointer; color: #777; flex: 1; padding: 8px 0; }
        nav div.active { color: #1976D2; font-weight: bold; }

        /* Main Content */
        .page { display: none; padding: 10px; padding-bottom: 70px; }
        .page.active { display: block; }

        /* Summary Header */
        .summary-card { background: #E3F2FD; border: 1px solid #90CAF9; border-radius: 12px; padding: 10px; display: flex; justify-content: space-around; text-align: center; margin-bottom: 10px; gap: 4px; }
        .summary-box { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .summary-title { font-size: 11px; color: #666; font-weight: bold; }
        .summary-value { font-size: 13px; color: #1976D2; font-weight: bold; margin: 2px 0; }
        .summary-sub { font-size: 10px; color: #424242; font-weight: bold; }

        /* Header Controls */
        .month-picker { display: flex; justify-content: center; align-items: center; gap: 16px; margin-bottom: 10px; }
        .month-picker button { background: none; border: none; font-size: 20px; cursor: pointer; font-weight: bold; color: #757575; padding: 0 8px; }
        .month-picker h3 { font-size: 20px; font-weight: bold; }

        /* Calendar Grid */
        .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; font-size: 14px; margin-bottom: 6px; }
        .calendar-header div:nth-child(1) { color: #D32F2F; }
        .calendar-header div:nth-child(7) { color: #1976D2; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        
        .day-cell { height: 84px; border-radius: 6px; border: 0.5px solid #E0E0E0; padding: 0; display: flex; flex-direction: column; justify-content: space-between; align-items: center; cursor: pointer; font-size: 11px; position: relative; box-sizing: border-box; background: white; overflow: hidden; }
        .day-cell.selected { border: 2.5px solid #E65100 !important; }
        .day-cell.other-month { opacity: 0.35; }

        .cell-row { width: 100%; text-align: center; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        
        .date-row { height: 20px; font-size: 13px; line-height: 20px; background: rgba(0, 0, 0, 0.05); border-bottom: 1px solid rgba(0, 0, 0, 0.08); width: 100%; }
        .holiday-row { height: 14px; font-size: 8px; line-height: 14px; font-weight: bold; }
        .ticket-row { height: 14px; font-size: 9px; line-height: 14px; }
        .overtime-row { height: 14px; font-size: 10px; line-height: 14px; font-weight: bold; margin-bottom: 2px; }

        /* Day Details Section */
        .detail-card { background: #F5F5F5; border-radius: 16px; padding: 14px; margin-top: 10px; }
        .action-row { display: flex; gap: 6px; margin: 8px 0; }
        .action-btn { flex: 1; padding: 6px 0; border-radius: 50px; border: 1.5px solid #1976D2; background: white; font-weight: bold; cursor: pointer; font-size: 12px; text-align: center; color: black; }
        .action-btn.red { border-color: #D32F2F; }

        .status-row { display: flex; gap: 8px; margin-top: 6px; }
        .status-btn { flex: 1; height: 40px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; color: black; }

        /* Modal Memo */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 85%; max-width: 360px; }
        .modal-content input { width: 100%; padding: 10px; margin: 6px 0 12px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }

        /* Settings */
        .setting-card { background: #FAFAFA; border: 1px solid #E0E0E0; border-radius: 20px; padding: 16px; margin-bottom: 12px; }
        .setting-card h4 { margin-bottom: 8px; font-size: 16px; }
        .shift-select-row { margin-bottom: 12px; }
        .shift-options { display: flex; gap: 4px; margin-top: 6px; }
        .shift-opt { flex: 1; text-align: center; padding: 8px 0; border: 1px solid #E0E0E0; border-radius: 8px; font-size: 11px; cursor: pointer; background: #F5F5F5; font-weight: bold; }
        .shift-opt.selected { border: 2px solid #1E88E5; }
    </style>
</head>
<body>

<div id="app-container">
    <!-- 로그인 화면 -->
    <div id="auth-screen" class="auth-card">
        <h2>📱 근무수첩 로그인</h2>
        <input type="email" id="auth-email" placeholder="이메일 아이디">
        <input type="password" id="auth-password" placeholder="비밀번호 (6자리 이상)">
        <button onclick="login()">로그인</button>
        <button class="sub-btn" onclick="signup()">회원가입</button>
    </div>

    <!-- 메인 앱 화면 -->
    <div id="main-screen" style="display: none;">
        <!-- 달력 탭 -->
        <div id="calendar-page" class="page active">
            <div class="summary-card">
                <div class="summary-box">
                    <div class="summary-title">🎫 남은 식권</div>
                    <div class="summary-value" id="summary-tickets">0 개</div>
                    <div class="summary-sub" id="summary-off">총 휴무 일수 : 0일</div>
                </div>
                <div style="width: 1px; background: #BDBDBD;"></div>
                <div class="summary-box">
                    <div class="summary-title">✈️ 남은 공항식권</div>
                    <div class="summary-value" id="summary-airport-tickets" style="color: #7B1FA2;">0 개</div>
                    <div class="summary-sub" id="summary-overtime-sub" style="color: #E65100;">연장: 0 h</div>
                </div>
            </div>

            <div class="month-picker">
                <button onclick="changeMonth(-1)">◀</button>
                <h3 id="current-month-text">2026년 9월</h3>
                <button onclick="changeMonth(1)">▶</button>
            </div>

            <div class="calendar-header">
                <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>

            <div class="detail-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <h4 id="selected-date-text" style="margin: 0; font-size: 13px;">📝 1일 선택됨</h4>
                    <!-- 식권 종류 스위치 -->
                    <div style="background: #e0e0e0; border-radius: 20px; padding: 2px; display: flex; cursor: pointer; font-size: 11px; font-weight: bold;">
                        <span id="tab-normal-ticket" onclick="setTicketType('normal')" style="padding: 3px 8px; border-radius: 16px; background: #1976D2; color: white;">기본식권</span>
                        <span id="tab-airport-ticket" onclick="setTicketType('airport')" style="padding: 3px 8px; border-radius: 16px; color: #333;">공항식권</span>
                    </div>
                </div>

                <div class="action-row">
                    <button class="action-btn" onclick="addTicket(1)">식권+1</button>
                    <button class="action-btn red" onclick="addTicket(-1)">식권-1</button>
                    <button class="action-btn" onclick="addOvertime(0.5)">연장<br>+0.5</button>
                    <button class="action-btn red" onclick="addOvertime(-0.5)">연장<br>-0.5</button>
                </div>

                <div style="background: white; padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 8px; font-size: 13px;">
                    <div id="detail-overtime" style="color:#E65100; font-weight:bold;">⏱️ 연장근무: 0시간</div>
                    <div id="detail-status" style="font-weight:bold;">📌 근무 상태: 근무</div>
                    <div id="detail-memo" style="color: #2E7D32;"></div>
                    <div id="detail-tip" style="color: #D32F2F; font-weight: bold;"></div>
                    <div id="detail-ticket" style="font-weight:bold;">🎫 식권: 내역 없음</div>
                </div>

                <div style="font-size: 12px; font-weight: bold; margin-bottom:
