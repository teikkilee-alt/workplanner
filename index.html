<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>근무수첩</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f8; display: flex; justify-content: center; min-height: 100vh; }
        #app-container { width: 100%; max-width: 480px; background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; position: relative; }
        
        /* Auth Screen */
        .auth-card { padding: 24px; text-align: center; margin-top: 60px; }
        .auth-card h2 { margin-bottom: 20px; font-size: 24px; color: #1976D2; font-weight: bold; }
        .auth-card input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; }
        .auth-card button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; background: #1976D2; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .auth-card .sub-btn { background: #666; }

        /* Navigation */
        nav { display: flex; justify-content: space-around; background: #fff; border-top: 1px solid #eee; position: fixed; bottom: 0; width: 100%; max-width: 480px; height: 56px; align-items: center; z-index: 100; }
        nav div { text-align: center; font-size: 12px; cursor: pointer; color: #777; flex: 1; padding: 8px 0; }
        nav div.active { color: #1976D2; font-weight: bold; }

        /* Main Content */
        .page { display: none; padding: 10px; padding-bottom: 70px; }
        .page.active { display: block; }

        /* Summary Header */
        .summary-card { background: #E3F2FD; border: 1px solid #90CAF9; border-radius: 12px; padding: 12px; display: flex; justify-content: space-around; text-align: center; margin-bottom: 10px; }
        .summary-box { flex: 1; }
        .summary-title { font-size: 12px; color: #666; font-weight: bold; }
        .summary-value { font-size: 14px; color: #1976D2; font-weight: bold; margin: 2px 0; }
        .summary-sub { font-size: 11px; color: #424242; font-weight: bold; }

        /* Header Controls */
        .month-picker { display: flex; justify-content: center; align-items: center; gap: 16px; margin-bottom: 10px; }
        .month-picker button { background: none; border: none; font-size: 20px; cursor: pointer; font-weight: bold; color: #757575; padding: 0 8px; }
        .month-picker h3 { font-size: 20px; font-weight: bold; }

        /* Calendar Grid */
        .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; font-size: 14px; margin-bottom: 6px; }
        .calendar-header div:nth-child(1) { color: #D32F2F; }
        .calendar-header div:nth-child(7) { color: #1976D2; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .day-cell { height: 78px; border-radius: 6px; border: 0.5px solid #E0E0E0; padding: 4px 2px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; cursor: pointer; font-size: 11px; position: relative; box-sizing: border-box; background: white; }
        .day-cell.selected { border: 2.5px solid #E65100 !important; }
        .day-cell.other-month { opacity: 0.35; }

        /* Day Details Section */
        .detail-card { background: #F5F5F5; border-radius: 16px; padding: 14px; margin-top: 10px; }
        .action-row { display: flex; gap: 6px; margin: 8px 0; }
        .action-btn { flex: 1; padding: 6px 0; border-radius: 50px; border: 1.5px solid #1976D2; background: white; font-weight: bold; cursor: pointer; font-size: 12px; text-align: center; color: black; }
        .action-btn.red { border-color: #D32F2F; }

        .status-row { display: flex; gap: 8px; margin-top: 6px; }
        .status-btn { flex: 1; height: 40px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; color: black; }

        /* Modal Memo */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 85%; max-width: 360px; }
        .modal-content input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }

        /* Settings */
        .setting-card { background: #FAFAFA; border: 1px solid #E0E0E0; border-radius: 20px; padding: 16px; margin-bottom: 12px; }
        .setting-card h4 { margin-bottom: 8px; font-size: 16px; }
        .shift-select-row { margin-bottom: 12px; }
        .shift-options { display: flex; gap: 4px; margin-top: 6px; }
        .shift-opt { flex: 1; text-align: center; padding: 8px 0; border: 1px solid #E0E0E0; border-radius: 8px; font-size: 11px; cursor: pointer; background: #F5F5F5; font-weight: bold; }
        .shift-opt.selected { border: 2px solid #1E88E5; }
    </style>
</head>
<body>

<div id="app-container">
    <!-- 로그인 화면 -->
    <div id="auth-screen" class="auth-card">
        <h2>📱 근무수첩 로그인</h2>
        <input type="email" id="auth-email" placeholder="이메일 아이디">
        <input type="password" id="auth-password" placeholder="비밀번호 (6자리 이상)">
        <button onclick="login()">로그인</button>
        <button class="sub-btn" onclick="signup()">회원가입</button>
    </div>

    <!-- 메인 앱 화면 -->
    <div id="main-screen" style="display: none;">
        <!-- 달력 탭 -->
        <div id="calendar-page" class="page active">
            <div class="summary-card">
                <div class="summary-box">
                    <div class="summary-title">🎫 남은 식권 수</div>
                    <div class="summary-value" id="summary-tickets">0 개</div>
                    <div class="summary-sub" id="summary-off">총 휴무 일수 : 0일</div>
                </div>
                <div style="width: 1px; background: #BDBDBD;"></div>
                <div class="summary-box">
                    <div class="summary-title">⏱️ 총 연장 근무 시간</div>
                    <div class="summary-value" id="summary-overtime" style="color: #E65100;">0 h</div>
                </div>
            </div>

            <div class="month-picker">
                <button onclick="changeMonth(-1)">◀</button>
                <h3 id="current-month-text">2026년 9월</h3>
                <button onclick="changeMonth(1)">▶</button>
            </div>

            <div class="calendar-header">
                <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>

            <div class="detail-card">
                <h4 id="selected-date-text">📝 1일 선택됨</h4>
                <div class="action-row">
                    <button class="action-btn" onclick="addTicket(1)">식권+1</button>
                    <button class="action-btn red" onclick="addTicket(-1)">식권-1</button>
                    <button class="action-btn" onclick="addOvertime(0.5)">연장<br>+0.5</button>
                    <button class="action-btn red" onclick="addOvertime(-0.5)">연장<br>-0.5</button>
                </div>

                <div style="background: white; padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 8px; font-size: 13px;">
                    <div id="detail-overtime" style="color:#E65100; font-weight:bold;">⏱️ 연장근무: 0시간</div>
                    <div id="detail-status" style="font-weight:bold;">📌 근무 상태: 근무</div>
                    <div id="detail-memo" style="color: #2E7D32;"></div>
                    <div id="detail-ticket" style="font-weight:bold;">🎫 식권: 내역 없음</div>
                </div>

                <div style="font-size: 12px; font-weight: bold; margin-bottom: 4px;">• 근무 상태 변경:</div>
                <div class="status-row">
                    <button id="btn-status-off" class="status-btn" style="background: #E0E0E0;" onclick="toggleOffStatus()">휴무</button>
                    <button id="btn-status-annual" class="status-btn" style="background: #FFF59D;" onclick="setStatus('연차')">연차</button>
                    <button id="btn-status-work" class="status-btn" style="background: #BBDEFB;" onclick="cycleWorkStatus()">근무</button>
                </div>
                <div id="reset-ticket-box" style="margin-top: 8px; display: none;">
                    <button onclick="resetDayTicket()" style="width: 100%; padding: 8px; background: #757575; color: white; border: none; border-radius: 6px; font-size: 12px;">당일 식권 기록 초기화 🔄</button>
                </div>
            </div>
        </div>

        <!-- 설정 탭 -->
        <div id="settings-page" class="page">
            <h2 style="margin-bottom: 16px;">⚙️ 설정</h2>
            <div class="setting-card">
                <h4 id="setting-ticket-label">🎫 기본 식권 수량 설정</h4>
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="base-ticket-input" style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px;">
                    <button onclick="saveBaseTickets()" style="padding: 8px 16px; background: #1E88E5; color: white; border: none; border-radius: 6px; font-weight: bold;">저장</button>
                </div>
            </div>

            <div class="setting-card">
                <h4>📅 근무 패턴 설정</h4>
                <div id="shift-settings-container"></div>
            </div>

            <!-- 로그인 계정 정보 표시 카드 -->
            <div class="setting-card" style="text-align: center; background: #F5F5F5;">
                <div style="font-size: 12px; color: #666; font-weight: bold; margin-bottom: 4px;">👤 현재 로그인 계정</div>
                <div id="user-email-display" style="font-size: 14px; font-weight: bold; color: #1976D2;"></div>
            </div>

            <button onclick="logout()" style="width: 100%; padding: 12px; background: #D32F2F; color: white; border: none; border-radius: 8px; margin-top: 10px; font-weight: bold;">로그아웃</button>
        </div>

        <nav>
            <div id="nav-cal" class="active" onclick="switchTab('cal')">📅<br>달력</div>
            <div id="nav-set" onclick="switchTab('set')">⚙️<br>설정</div>
        </nav>
    </div>
</div>

<!-- 메모 작성 모달 -->
<div id="memo-modal" class="modal">
    <div class="modal-content">
        <h3 id="memo-title">📝 메모</h3>
        <input type="text" id="memo-input" maxlength="30" placeholder="메모 입력 (30자 이내)">
        <div class="modal-btns">
            <button onclick="deleteMemo()" style="background: none; border: none; color: #D32F2F; cursor: pointer;">삭제</button>
            <button onclick="closeMemoModal()" style="background: none; border: none; color: #666; cursor: pointer;">취소</button>
            <button onclick="saveMemo()" style="background: none; border: none; color: #1976D2; font-weight: bold; cursor: pointer;">저장</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDnwYQ6WT9TVD-y5hbDWU7LkuafgIrivfQ",
        authDomain: "my-work-planner-4542.firebaseapp.com",
        projectId: "my-work-planner-4542",
        storageBucket: "my-work-planner-4542.firebasestorage.app",
        messagingSenderId: "204177923365",
        appId: "1:204177923365:web:9e904efcdaefeac46acecc"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let selectedDay = new Date().getDate();

    let userMonthData = {};
    let allMonthsData = {};

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';
            loadData();
        } else {
            currentUser = null;
            document.getElementById('auth-screen').style.display = 'block';
            document.getElementById('main-screen').style.display = 'none';
        }
    });

    // Firebase Auth 에러 코드를 친절한 한글 문구로 변환하는 함수
    function getAuthErrorMessage(error) {
        switch (error.code) {
            case 'auth/weak-password':
                return '비밀번호는 최소 6자리 이상이어야 합니다.';
            case 'auth/email-already-in-use':
                return '이미 가입되어 있는 이메일 주소입니다.';
            case 'auth/invalid-email':
                return '올바른 이메일 형식이 아닙니다.';
            case 'auth/user-not-found':
            case 'auth/wrong-password':
            case 'auth/invalid-credential':
                return '이메일 또는 비밀번호가 올바르지 않습니다.';
            case 'auth/missing-password':
                return '비밀번호를 입력해 주세요.';
            case 'auth/too-many-requests':
                return '로그인 시도가 너무 많습니다. 잠시 후 다시 시도해 주세요.';
            case 'auth/network-request-failed':
                return '네트워크 연결 상태를 확인해 주세요.';
            default:
                return '오류가 발생했습니다: ' + error.message;
        }
    }

    function login() {
        const email = document.getElementById('auth-email').value.trim();
        const pass = document.getElementById('auth-password').value;
        
        if (!email || !pass) {
            alert("이메일과 비밀번호를 모두 입력해 주세요.");
            return;
        }

        auth.signInWithEmailAndPassword(email, pass).catch(e => alert(getAuthErrorMessage(e)));
    }

    function signup() {
        const email = document.getElementById('auth-email').value.trim();
        const pass = document.getElementById('auth-password').value;

        if (!email || !pass) {
            alert("이메일과 비밀번호를 모두 입력해 주세요.");
            return;
        }

        auth.createUserWithEmailAndPassword(email, pass)
            .then(() => alert("회원가입이 완료되었습니다!"))
            .catch(e => alert(getAuthErrorMessage(e)));
    }

    function logout() { auth.signOut(); }

    function switchTab(tab) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav div').forEach(n => n.classList.remove('active'));
        if(tab === 'cal') {
            document.getElementById('calendar-page').classList.add('active');
            document.getElementById('nav-cal').classList.add('active');
        } else {
            document.getElementById('settings-page').classList.add('active');
            document.getElementById('nav-set').classList.add('active');
            renderSettings();
        }
    }

    function getDefaultMonthData() {
        return {
            baseTicketCount: 9,
            shift1to10: "모닝 🌅",
            shift11to20: "상근 💼",
            shift21to30: "데이 ⏰",
            shift31: "야간 🌙",
            days: {}
        };
    }

    function getDocRef(y = currentYear, m = currentMonth) {
        const monthKey = `${y}_${m}`;
        return db.collection('users').doc(currentUser.uid).collection('months').doc(monthKey);
    }

    function loadData() {
        let prevYear = currentYear, prevMonth = currentMonth - 1;
        if (prevMonth < 0) { prevMonth = 11; prevYear--; }

        let nextYear = currentYear, nextMonth = currentMonth + 1;
        if (nextMonth > 11) { nextMonth = 0; nextYear++; }

        const currentKey = `${currentYear}_${currentMonth}`;
        const prevKey = `${prevYear}_${prevMonth}`;
        const nextKey = `${nextYear}_${nextMonth}`;

        Promise.all([
            getDocRef(prevYear, prevMonth).get(),
            getDocRef(currentYear, currentMonth).get(),
            getDocRef(nextYear, nextMonth).get()
        ]).then(([prevDoc, currentDoc, nextDoc]) => {
            allMonthsData[prevKey] = prevDoc.exists ? prevDoc.data() : getDefaultMonthData();
            allMonthsData[currentKey] = currentDoc.exists ? currentDoc.data() : getDefaultMonthData();
            allMonthsData[nextKey] = nextDoc.exists ? nextDoc.data() : getDefaultMonthData();

            userMonthData = allMonthsData[currentKey];

            autoApplyMorningTicketsForMonth(prevYear, prevMonth);
            autoApplyMorningTicketsForMonth(currentYear, currentMonth);
            autoApplyMorningTicketsForMonth(nextYear, nextMonth);

            renderCalendar();
            renderSettings();
        });
    }

    function saveData() {
        const currentKey = `${currentYear}_${currentMonth}`;
        allMonthsData[currentKey] = userMonthData;
        getDocRef(currentYear, currentMonth).set(userMonthData, { merge: true }).then(() => {
            renderCalendar();
        });
    }

    function getShiftColor(shift) {
        if(!shift) return '#FFFFFF';
        if(shift.includes("모닝")) return '#FFCC99';
        if(shift.includes("상근")) return '#FFFFFF';
        if(shift.includes("데이")) return '#B3E5FC';
        if(shift.includes("야간")) return '#E1BEE7';
        return '#FFFFFF';
    }

    function getShiftForDay(d, mData) {
        const data = mData || userMonthData;
        if(!data) return "상근 💼";
        if(d <= 10) return data.shift1to10;
        if(d <= 20) return data.shift11to20;
        if(d <= 30) return data.shift21to30;
        return data.shift31;
    }

    function autoApplyMorningTicketsForMonth(y, m) {
        const monthKey = `${y}_${m}`;
        const mData = allMonthsData[monthKey];
        if(!mData) return;
        if(!mData.days) mData.days = {};

        const totalDays = new Date(y, m + 1, 0).getDate();
        for(let d=1; d<=totalDays; d++) {
            let shift = getShiftForDay(d, mData);
            const isMorning = shift && shift.includes("모닝");
            const dateKey = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

            if(!mData.days[dateKey]) {
                mData.days[dateKey] = { earned: isMorning ? 1 : 0, used: 0, status: '근무', overtime: 0, memo: '' };
            } else {
                const day = mData.days[dateKey];
                
                if (!isMorning) {
                    if (day.earned === 1 && !day.manualEarned) {
                        day.earned = 0;
                    }
                } else {
                    const isNonWork = ['휴무', '연차', '검진'].includes(day.status);
                    if (isNonWork) {
                        if (day.earned === 1 && !day.manualEarned) {
                            day.earned = 0;
                        }
                    } else if (day.earned === 0 && !day.resetByUser && !day.manualEarned) {
                        day.earned = 1;
                    }
                }
            }
        }
    }

    function createCellElement(y, m, d, isOtherMonth) {
        const monthKey = `${y}_${m}`;
        const targetMonthData = allMonthsData[monthKey] || getDefaultMonthData();
        const dateKey = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        
        let dayData = (targetMonthData.days && targetMonthData.days[dateKey]);
        let shift = getShiftForDay(d, targetMonthData);

        if (!dayData) {
            const isMorning = shift && shift.includes("모닝");
            dayData = { earned: isMorning ? 1 : 0, used: 0, status: '근무', overtime: 0, memo: '' };
        }

        const cell = document.createElement('div');
        cell.className = `day-cell ${isOtherMonth ? 'other-month' : ''} ${(!isOtherMonth && d === selectedDay) ? 'selected' : ''}`;

        if (dayData.status === '휴무') cell.style.background = '#E0E0E0';
        else if (dayData.status === '검진') cell.style.background = '#C8E6C9';
        else if (dayData.status === '연차') cell.style.background = '#FFF176';
        else cell.style.background = getShiftColor(shift);

        const dayOfWeek = new Date(y, m, d).getDay();
        let dateColor = 'black';
        if (dayOfWeek === 0) dateColor = '#D32F2F';
        else if (dayOfWeek === 6) dateColor = '#1976D2';

        let statusText = '';
        if (dayData.status === '남') statusText = `<span style="color:#1976D2; font-weight:bold;"> (남)</span>`;
        else if (dayData.status === '북') statusText = `<span style="color:#6A1B9A; font-weight:bold;"> (북)</span>`;
        else if (dayData.status === '휴근') statusText = `<span style="color:#E65100; font-weight:bold;"> (휴근)</span>`;
        else if (dayData.status === '검진') statusText = `<span style="color:#2E7D32; font-weight:bold;"> (검진)</span>`;

        let memoIcon = dayData.memo ? `<span style="color:#2E7D32; font-weight:bold;"> ✔</span>` : '';

        let earnedUsedHTML = '&nbsp;';
        if (dayData.earned > 0 || dayData.used > 0) {
            let earnedStr = dayData.earned > 0 ? `<span style="color:#1976D2; font-weight:bold;">+${dayData.earned}</span>` : '';
            let usedStr = dayData.used > 0 ? `<span style="color:#D32F2F; font-weight:bold;">-${dayData.used}</span>` : '';
            earnedUsedHTML = `${earnedStr} ${usedStr}`.trim();
        }

        let overtimeHTML = dayData.overtime > 0 ? `${dayData.overtime}h` : '&nbsp;';

        cell.innerHTML = `
            <div style="color:${dateColor}; line-height: 1.2;">${d}${statusText}${memoIcon}</div>
            <div style="font-size:9px; display:flex; gap:2px; min-height:12px; align-items:center; justify-content:center;">${earnedUsedHTML}</div>
            <div style="font-weight:bold; font-size:10px; min-height:13px; display:flex; align-items:center; justify-content:center;">${overtimeHTML}</div>
        `;

        cell.onclick = () => {
            if (isOtherMonth) {
                currentYear = y;
                currentMonth = m;
                selectedDay = d;
                loadData();
            } else {
                if (selectedDay === d) {
                    openMemoModal(dayData.memo || '');
                } else {
                    selectedDay = d;
                    renderCalendar();
                }
            }
        };

        return cell;
    }

    function renderCalendar() {
        document.getElementById('current-month-text').innerText = `${currentYear}년 ${currentMonth + 1}월`;
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';

        let prevYear = currentYear;
        let prevMonth = currentMonth - 1;
        if (prevMonth < 0) { prevMonth = 11; prevYear--; }

        let nextYear = currentYear;
        let nextMonth = currentMonth + 1;
        if (nextMonth > 11) { nextMonth = 0; nextYear++; }

        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
        const prevMonthTotalDays = new Date(currentYear, prevMonth + 1, 0).getDate();

        let totalEarned = 0, totalUsed = 0, totalOvertime = 0, offDays = 0, remainingWorkDays = 0;
        const today = new Date();
        const isCurrentMonth = (today.getFullYear() === currentYear && today.getMonth() === currentMonth);

        for(let i=0; i<firstDay; i++) {
            const pDay = prevMonthTotalDays - (firstDay - 1 - i);
            const cell = createCellElement(prevYear, prevMonth, pDay, true);
            grid.appendChild(cell);
        }

        for(let d=1; d<=totalDays; d++) {
            const dateKey = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const dayData = (userMonthData.days && userMonthData.days[dateKey]) || { earned:0, used:0, status:'근무', overtime:0, memo:'' };

            totalEarned += dayData.earned || 0;
            totalUsed += dayData.used || 0;
            totalOvertime += dayData.overtime || 0;
            if(dayData.status === '휴무') offDays++;

            if ((isCurrentMonth && d >= today.getDate()) || (!isCurrentMonth && currentYear >= today.getFullYear() && currentMonth > today.getMonth())) {
                if(!['휴무', '검진', '연차'].includes(dayData.status)) remainingWorkDays++;
            }

            const cell = createCellElement(currentYear, currentMonth, d, false);
            grid.appendChild(cell);
        }

        const totalRendered = firstDay + totalDays;
        const nextDaysCount = (7 - (totalRendered % 7)) % 7;
        for(let n=1; n<=nextDaysCount; n++) {
            const cell = createCellElement(nextYear, nextMonth, n, true);
            grid.appendChild(cell);
        }

        const baseTickets = userMonthData.baseTicketCount || 9;
        const finalTickets = baseTickets + totalEarned - totalUsed;
        
        let ticketSub = '';
        if(totalEarned > 0 && totalUsed > 0) ticketSub = ` (+${totalEarned} / -${totalUsed})`;
        else if(totalEarned > 0) ticketSub = ` (+${totalEarned})`;
        else if(totalUsed > 0) ticketSub = ` (-${totalUsed})`;

        document.getElementById('summary-tickets').innerText = `${finalTickets} 개${ticketSub}`;
        document.getElementById('summary-off').innerText = `총 휴무 일수 : ${offDays}일`;
        document.getElementById('summary-overtime').innerText = `${totalOvertime} h (${remainingWorkDays}일 남음)`;

        renderDetail();
    }

    function renderDetail() {
        const dateKey = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(selectedDay).padStart(2,'0')}`;
        const dayData = (userMonthData.days && userMonthData.days[dateKey]) || { earned:0, used:0, status:'근무', overtime:0, memo:'' };

        document.getElementById('selected-date-text').innerText = `📝 ${currentMonth + 1}월 ${selectedDay}일 선택됨`;
        document.getElementById('detail-overtime').innerText = `⏱️ 연장근무: ${dayData.overtime || 0}시간`;
        document.getElementById('detail-status').innerText = `📌 근무 상태: ${dayData.status || '근무'}`;
        document.getElementById('detail-memo').innerText = dayData.memo ? `📝 메모: ${dayData.memo}` : '';
        
        if(!dayData.earned && !dayData.used) {
            document.getElementById('detail-ticket').innerText = `🎫 식권: 내역 없음`;
        } else {
            let tTxt = `🎫 식권: `;
            if(dayData.earned > 0) tTxt += `${dayData.earned}개 획득 `;
            if(dayData.used > 0) tTxt += `${dayData.used}개 사용`;
            document.getElementById('detail-ticket').innerText = tTxt;
        }
        
        const offBtn = document.getElementById('btn-status-off');
        offBtn.innerText = dayData.status === '검진' ? '검진' : '휴무';
        offBtn.style.background = dayData.status === '검진' ? '#388E3C' : (dayData.status === '휴무' ? '#757575' : '#E0E0E0');
        offBtn.style.color = (dayData.status === '휴무' || dayData.status === '검진') ? 'white' : 'black';

        const workBtn = document.getElementById('btn-status-work');
        let wText = '근무';
        if(dayData.status === '남') { wText = '근무(남)'; workBtn.style.background = '#1565C0'; workBtn.style.color = 'white'; }
        else if(dayData.status === '북') { wText = '근무(북)'; workBtn.style.background = '#6A1B9A'; workBtn.style.color = 'white'; }
        else if(dayData.status === '휴근') { wText = '근무(휴근)'; workBtn.style.background = '#E65100'; workBtn.style.color = 'white'; }
        else if(dayData.status === '근무') { wText = '근무'; workBtn.style.background = '#1E88E5'; workBtn.style.color = 'white'; }
        else { wText = '근무'; workBtn.style.background = '#BBDEFB'; workBtn.style.color = 'black'; }
        workBtn.innerText = wText;

        const resetBox = document.getElementById('reset-ticket-box');
        if((dayData.earned || 0) > 0 || (dayData.used || 0) > 0) {
            resetBox.style.display = 'block';
        } else {
            resetBox.style.display = 'none';
        }
    }

    function getSelectedDayData() {
        if(!userMonthData.days) userMonthData.days = {};
        const dateKey = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(selectedDay).padStart(2,'0')}`;
        if(!userMonthData.days[dateKey]) {
            userMonthData.days[dateKey] = { earned:0, used:0, status:'근무', overtime:0, memo:'' };
        }
        return { data: userMonthData.days[dateKey], key: dateKey, dayNum: selectedDay };
    }

    function addTicket(val) {
        const { data } = getSelectedDayData();
        if(val > 0) {
            data.earned = (data.earned || 0) + val;
            data.manualEarned = true;
        } else {
            data.used = Math.max(0, (data.used || 0) - val);
        }
        saveData();
    }

    function resetDayTicket() {
        const { data } = getSelectedDayData();
        data.earned = 0;
        data.used = 0;
        data.resetByUser = true;
        data.manualEarned = false;
        saveData();
    }

    function addOvertime(val) {
        const { data } = getSelectedDayData();
        data.overtime = Math.max(0, (data.overtime || 0) + val);
        saveData();
    }

    function setStatus(status) {
        const { data, dayNum } = getSelectedDayData();
        
        if (data.status === '휴근' && status !== '휴근') {
            data.overtime = Math.max(0, (data.overtime || 0) - 8.0);
        }

        data.status = status;
        
        const shift = getShiftForDay(dayNum, userMonthData);
        const isMorning = shift && shift.includes("모닝");

        if (['휴무', '연차', '검진'].includes(status)) {
            if (isMorning && data.earned === 1 && !data.manualEarned) {
                data.earned = 0;
            }
        } else {
            if (isMorning && data.earned === 0 && !data.resetByUser) {
                data.earned = 1;
            }
        }
        saveData();
    }

    function toggleOffStatus() {
        const { data, dayNum } = getSelectedDayData();
        
        if (data.status === '휴근') {
            data.overtime = Math.max(0, (data.overtime || 0) - 8.0);
        }

        const nextStatus = data.status === '휴무' ? '검진' : '휴무';
        data.status = nextStatus;

        const shift = getShiftForDay(dayNum, userMonthData);
        if (shift && shift.includes("모닝") && data.earned === 1 && !data.manualEarned) {
            data.earned = 0;
        }
        saveData();
    }

    function cycleWorkStatus() {
        const { data, dayNum } = getSelectedDayData();
        const cycle = ['근무', '남', '북', '휴근'];
        let idx = cycle.indexOf(data.status);

        if (data.status === '휴근') {
            data.overtime = Math.max(0, (data.overtime || 0) - 8.0);
        }

        let next = cycle[(idx + 1) % cycle.length];
        data.status = next;

        if (next === '휴근') {
            data.overtime = (data.overtime || 0) + 8.0;
        }

        const shift = getShiftForDay(dayNum, userMonthData);
        if (shift && shift.includes("모닝") && data.earned === 0 && !data.resetByUser) {
            data.earned = 1;
        }
        saveData();
    }

    function changeMonth(delta) {
        currentMonth += delta;
        if(currentMonth < 0) { currentMonth = 11; currentYear--; }
        if(currentMonth > 11) { currentMonth = 0; currentYear++; }
        selectedDay = 1;
        loadData();
    }

    function openMemoModal(memo) {
        document.getElementById('memo-title').innerText = `📝 ${currentMonth + 1}월 ${selectedDay}일 메모`;
        document.getElementById('memo-input').value = memo;
        document.getElementById('memo-modal').style.display = 'flex';
    }
    function closeMemoModal() { document.getElementById('memo-modal').style.display = 'none'; }
    function saveMemo() {
        const { data } = getSelectedDayData();
        data.memo = document.getElementById('memo-input').value;
        closeMemoModal();
        saveData();
    }
    function deleteMemo() {
        const { data } = getSelectedDayData();
        data.memo = '';
        closeMemoModal();
        saveData();
    }

    function renderSettings() {
        document.getElementById('setting-ticket-label').innerText = `🎫 ${currentYear}년 ${currentMonth + 1}월 기본 식권 수량`;
        document.getElementById('base-ticket-input').value = userMonthData.baseTicketCount || 9;

        if (currentUser) {
            document.getElementById('user-email-display').innerText = currentUser.email || '이메일 정보 없음';
        }

        const container = document.getElementById('shift-settings-container');
        container.innerHTML = '';

        const shifts = [
            { key: 'shift1to10', label: '1일 ~ 10일' },
            { key: 'shift11to20', label: '11일 ~ 20일' },
            { key: 'shift21to30', label: '21일 ~ 30일' },
            { key: 'shift31', label: '31일 (개별)' }
        ];

        shifts.forEach(s => {
            const div = document.createElement('div');
            div.className = 'shift-select-row';
            div.innerHTML = `
                <div style="font-size:13px; font-weight:bold; color:#666;">${s.label}</div>
                <div class="shift-options">
                    ${['모닝 🌅', '상근 💼', '데이 ⏰', '야간 🌙'].map(opt => `
                        <div class="shift-opt ${userMonthData[s.key] === opt ? 'selected' : ''}" 
                             style="background: ${userMonthData[s.key] === opt ? getShiftColor(opt) : '#F5F5F5'}"
                             onclick="updateShiftPattern('${s.key}', '${opt}')">${opt.split(' ')[0]}</div>
                    `).join('')}
                </div>
            `;
            container.appendChild(div);
        });
    }

    function saveBaseTickets() {
        userMonthData.baseTicketCount = parseInt(document.getElementById('base-ticket-input').value) || 0;
        saveData();
    }

    function updateShiftPattern(key, val) {
        userMonthData[key] = val;
        autoApplyMorningTicketsForMonth(currentYear, currentMonth);
        saveData();
        renderSettings();
    }
</script>
</body>
</html>
